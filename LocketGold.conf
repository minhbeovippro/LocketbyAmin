deleteHeader = type=http-request, pattern=^https:\/\/api\.(revenuecat|rc-backup)\.com\/.+\/(receipts|subscribers), script-path=https://cdn.jsdelivr.net/gh/minhbeovippro/LocketbyAmin@main/deleteHeader.js, timeout=60
locket_rc = type=http-response, pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+, script-path=https://cdn.jsdelivr.net/gh/minhbeovippro/LocketbyAmin@main/LocketRC.js, requires-body=true, max-size=-1, timeout=60
